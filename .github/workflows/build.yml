name: Build

on: [push, pull_request]

jobs:
  webui:
    runs-on: ubuntu-24.04
    env:
      BUILD_TARGET: webui 
      BUILD_OS: linux
    steps:
    - uses: actions/checkout@v7

    - uses: actions/cache@v6
      with:
        path: '**/node_modules'
        key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

    - name: build webui
      run: ./dist/build_webui.sh

    - uses: actions/upload-artifact@v7
      with:
        name: webui
        path: build/artifacts/webui/webui.zip
        if-no-files-found: error

  ccheck:
    runs-on: ubuntu-24.04
    env:
      BUILD_TARGET: ccheck
      BUILD_OS: linux
    steps:
    - uses: actions/checkout@v7
    - name: ccheck
      run: ./dist/build.sh 

  build:
    needs: webui
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows64
            os: ubuntu-latest
            os_name: mingw
          - target: linux
            os: ubuntu-22.04
            os_name: linux
          - target: linuxjack
            os: ubuntu-22.04
            os_name: linux
          - target: macos_x86_64
            os: macos-15
            os_name: macos
          - target: macos_arm64
            os: macos-15
            os_name: macos

    env:
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_OS: ${{ matrix.os_name }}

    steps:
    - uses: actions/checkout@v7

    # webui.zip from the webui job, used by sl_get_webui
    - uses: actions/download-artifact@v8
      with:
        name: webui
        path: build

    - name: install mingw-w64
      if: ${{ matrix.os_name == 'mingw' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64 cmake zip unzip

    - name: build windows
      if: ${{ matrix.os_name == 'mingw' }}
      run: ./dist/build_windows.sh

    - name: prepare build
      if: ${{ matrix.os_name == 'linux' || matrix.os_name == 'macos' }}
      run: ./dist/before_build.sh

    - name: build
      if: ${{ matrix.os_name == 'linux' || matrix.os_name == 'macos' }}
      run: ./dist/build.sh

    - uses: actions/upload-artifact@v7
      with:
        name: studio-link-${{ matrix.target }}
        path: build/artifacts/${{ matrix.target }}/
        if-no-files-found: error

  # universal StudioLink.app and DAW plugins from the arm64 and x86_64 builds
  macos_universal:
    needs: build
    runs-on: macos-15
    env:
      BUILD_TARGET: macos_universal
      BUILD_OS: macos
    steps:
    - uses: actions/checkout@v7

    - uses: actions/download-artifact@v8
      with:
        name: studio-link-macos_arm64
        path: dl/arm64

    - uses: actions/download-artifact@v8
      with:
        name: studio-link-macos_x86_64
        path: dl/x86_64

    - name: prepare build
      run: ./dist/before_build.sh

    - name: merge
      run: |
        ./dist/macos_universal.sh dl/arm64 dl/x86_64 \
          build/artifacts/macos_universal

    - uses: actions/upload-artifact@v7
      with:
        name: studio-link-macos_universal
        path: build/artifacts/macos_universal/
        if-no-files-found: error

  # Public GitHub release for v* tags (e.g. v26.11.0-beta), only if every
  # target was built. Tags containing "beta" are marked as pre-release.
  release:
    needs: [build, macos_universal]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7

    - name: check tag matches dist/lib/versions.sh
      env:
        TAG: ${{ github.ref_name }}
      run: |
        source dist/lib/versions.sh
        source dist/lib/functions.sh
        sl_prepare_version
        if [[ "$TAG" != "$version_tc"* ]]; then
          echo "tag $TAG does not match version $version_tc (dist/lib/versions.sh)"
          exit 1
        fi

    - uses: actions/download-artifact@v8
      with:
        pattern: studio-link-*
        path: dl

    # file names repeat between targets (e.g. studio-link-plugin.zip),
    # append the target: studio-link-plugin-windows64.zip
    - name: collect release files
      run: |
        mkdir -p release
        for dir in dl/studio-link-*; do
          target=${dir#dl/studio-link-}
          # merged into macos_universal
          case "$target" in macos_arm64|macos_x86_64) continue ;; esac
          for f in "$dir"/*; do
            name=$(basename "$f")
            case "$name" in
              *.tar.gz) ext=.tar.gz ;;
              *) ext=".${name##*.}" ;;
            esac
            cp -a "$f" "release/${name%$ext}-$target$ext"
          done
        done
        ls -l release

    - name: upload release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ github.ref_name }}
      run: |
        prerelease=""
        [[ "$TAG" == *beta* ]] && prerelease="--prerelease"
        gh release view "$TAG" > /dev/null 2>&1 || \
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --generate-notes $prerelease
        gh release upload "$TAG" release/* --clobber
