name: Build

on: [push, pull_request]

jobs:
  webui:
    runs-on: ubuntu-24.04
    env:
      BUILD_TARGET: webui 
      BUILD_OS: linux
    steps:
    - uses: actions/checkout@v7

    - uses: actions/cache@v6
      with:
        path: '**/node_modules'
        key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

    - name: build webui
      run: ./dist/build_webui.sh

    - uses: actions/upload-artifact@v7
      with:
        name: webui
        path: build/artifacts/webui/webui.zip
        if-no-files-found: error

  ccheck:
    runs-on: ubuntu-24.04
    env:
      BUILD_TARGET: ccheck
      BUILD_OS: linux
    steps:
    - uses: actions/checkout@v7
    - name: ccheck
      run: ./dist/build.sh 

  build:
    needs: webui
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows64
            os: ubuntu-latest
            os_name: mingw
          - target: windows32
            os: ubuntu-latest
            os_name: mingw
          - target: linux
            os: ubuntu-22.04
            os_name: linux
          - target: linuxjack
            os: ubuntu-22.04
            os_name: linux
          - target: macos_x86_64
            os: macos-15
            os_name: macos
          - target: macos_arm64
            os: macos-15
            os_name: macos

    env:
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_OS: ${{ matrix.os_name }}

    steps:
    - uses: actions/checkout@v7

    # webui.zip from the webui job, used by sl_get_webui
    - uses: actions/download-artifact@v8
      with:
        name: webui
        path: build

    - name: install mingw-w64
      if: ${{ matrix.os_name == 'mingw' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64 cmake zip unzip

    - name: build windows
      if: ${{ matrix.os_name == 'mingw' }}
      run: ./dist/build_windows.sh

    - name: prepare build
      if: ${{ matrix.os_name == 'linux' || matrix.os_name == 'macos' }}
      run: ./dist/before_build.sh
      env:
        KEY_PASSWORD_2020: ${{ secrets.KEY_PASSWORD_2020 }}

    - name: build
      if: ${{ matrix.os_name == 'linux' || matrix.os_name == 'macos' }}
      run: ./dist/build.sh

    - uses: actions/upload-artifact@v7
      with:
        name: studio-link-${{ matrix.target }}
        path: build/artifacts/${{ matrix.target }}/
        if-no-files-found: error
